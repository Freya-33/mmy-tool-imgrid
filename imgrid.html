<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>百图九宫格拼图</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#36364b;background:#f9f9fd}
    *{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}
    .wrap{max-width:1400px;margin:auto;padding:28px 24px 60px}
    header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}h1{font-size:30px;letter-spacing:.03em;margin:0 0 7px}p{margin:0;color:#77788d;line-height:1.65}
    .badge{white-space:nowrap;border-radius:30px;background:#eeeafd;color:#7163a6;padding:9px 16px;font-weight:700}
    .panel{background:#fff;border:1px solid #eeeef5;border-radius:22px;box-shadow:0 12px 35px #6464860c;padding:22px;margin-bottom:18px}
    .sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}h2{font-size:17px;margin:0}small{color:#85859a}
    textarea{display:block;width:100%;min-height:98px;resize:vertical;border:1px solid #e5e4ef;border-radius:14px;padding:13px;background:#fcfcff;outline:none;line-height:1.6}textarea:focus{border-color:#b9acef}
    .actions,.options,.pager{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.actions{margin-top:12px}.options{margin-bottom:16px}
    button,.filelabel{border:0;background:#eeeafd;color:#594d85;border-radius:12px;padding:10px 15px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;min-height:41px}
    button:hover,.filelabel:hover{filter:brightness(.97)}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#aa9ae9;color:#fff}.soft{background:#f4edf8}.quiet{background:#f3f3f8;color:#666778}
    .filelabel input{display:none}.hint{font-size:12px;color:#89899a;line-height:1.5}
    select{border:1px solid #e6e4ee;border-radius:10px;background:#fff;padding:9px 12px;color:#47475d}
    .layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(330px,1fr);gap:18px}.gallery{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;max-height:750px;overflow:auto;padding-right:3px}
    .tile{border:2px solid transparent;border-radius:15px;background:#f8f7fc;overflow:hidden;min-width:0}.tile.selected{border-color:#aea0e8}.tilehead{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;font-size:12px;color:#626278}
    .tile img{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:#fff}.tilefoot{display:flex;gap:4px;padding:5px;justify-content:center}.tilefoot button{font-size:12px;min-height:26px;padding:2px 7px;border-radius:7px}.tile input{accent-color:#9e8ddf}
    .mosaic{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#f3f0fb;padding:8px;border-radius:14px;aspect-ratio:1}.cell{background:#fff;min-width:0;min-height:0;display:grid;place-items:center;position:relative;overflow:hidden;border-radius:6px}.cell img{width:100%;height:100%;object-fit:contain}.cell b{position:absolute;left:var(--number-left,5px);top:var(--number-top,5px);font-size:11px;background:#211c33c9;border-radius:5px;padding:2px 5px;color:#fff;z-index:2}
    .imagebox{position:relative;overflow:hidden;background:#fff}.imagebox img{display:block;width:100%;aspect-ratio:1;object-fit:contain}.blurband{display:none;position:absolute;left:var(--image-left,0px);top:var(--stripe-top,62.67%);width:var(--image-width,100%);height:var(--stripe-height,8%);background:#ffffff30;backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px);pointer-events:none}.watermark-on .blurband{display:block}.cell .blurband{z-index:1}
    .pager{justify-content:space-between;margin:13px 0}.pager span{font-size:14px;color:#6c6c83}.export{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.status{min-height:25px;color:#7662ad;font-size:13px;line-height:1.5;margin-top:10px}.status.error{color:#ba5266}
    .overlay{position:fixed;inset:0;background:#27233270;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.overlay.on{display:flex}.dialog{background:white;border-radius:20px;padding:24px;max-width:520px;width:100%;box-shadow:0 24px 70px #16102555}.dialog h2{margin-bottom:12px}.dialog p{font-size:14px;margin-bottom:20px}.dialog .actions{justify-content:flex-end}
    @media(max-width:900px){.layout{grid-template-columns:1fr}.gallery{grid-template-columns:repeat(4,minmax(0,1fr));max-height:520px}}@media(max-width:550px){.wrap{padding:20px 13px 45px}h1{font-size:24px}.panel{padding:15px}.gallery{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.tilefoot button{padding:2px 5px}.badge{font-size:12px}header{align-items:start}}
  </style>
</head>
<body>
<div class="wrap">
  <header><div><h1>百图九宫格</h1><p>粘贴图片链接或导入本地图片。按当前顺序每 9 张拼成一幅，原图完整显示。</p></div><div class="badge" id="counter">0 张图片</div></header>
  <section class="panel"><div class="sectionhead"><h2>添加图片</h2><small>粘贴“卡号：链接”等整段文字即可</small></div>
    <textarea id="input" placeholder="卡号：https://example.com/1.png&#10;卡号：https://example.com/2.png"></textarea>
    <div class="actions"><button class="primary" id="extract">提取链接并添加</button><label class="filelabel">导入本地图片<input id="files" type="file" accept="image/*" multiple></label><span class="hint">若图片站禁止跨域导出，可将图片保存到本地后导入；同名文件会替换对应链接。</span></div>
  </section>
  <div class="layout"><section class="panel"><div class="sectionhead"><h2>所有图片</h2><small id="chosen">已选 0 张</small></div><div class="options"><button class="quiet" id="all">全选</button><button class="quiet" id="none">清空选择</button><button class="quiet" id="reverse">反转顺序</button><button class="quiet" id="clear">清空草稿</button></div><p class="hint" id="storageState">正在读取本机草稿…</p><div class="gallery" id="gallery"></div></section>
    <section class="panel"><div class="sectionhead"><h2>拼图预览</h2><small>不剪裁，按比例缩放</small></div><div class="options"><label>每格尺寸 <select id="size"><option value="400">400 px</option><option value="600" selected>600 px</option><option value="800">800 px</option><option value="1200">1200 px</option></select></label><span class="hint">导出尺寸：<span id="dimensions">1800 × 1800 px</span></span></div><div class="options"><label><input type="checkbox" id="watermark"> 添加水印（图片下方水平模糊条）</label><label><input type="checkbox" id="numbered"> 下载图片显示编号</label></div><div class="mosaic" id="mosaic"></div><div class="pager"><button id="prev">上一幅</button><span id="pageInfo"></span><button id="next">下一幅</button></div><div class="export"><button class="primary" id="save">保存当前拼图 PNG</button><button class="soft" id="saveAll">全部拼图 ZIP</button><button class="soft" id="saveSingles">一键导出全部单图 ZIP</button></div><div class="status" id="status"></div></section></div>
</div>
<div class="overlay" id="overlay"><div class="dialog"><h2>有图片无法导出</h2><p id="errorText"></p><div class="actions"><button id="closeDialog">知道了</button></div></div></div>
<script>
let items=[];let page=0,busy=false,ready=false,saveTimer=0,saveChain=Promise.resolve();
const $=id=>document.getElementById(id);const chosen=()=>items.filter(x=>x.selected);const pages=()=>Math.ceil(chosen().length/9);const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const draftKey='nine-grid-draft-v1';
function openDraftDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(new Error('IndexedDB unavailable'));let req=indexedDB.open(draftKey,1);req.onupgradeneeded=()=>req.result.createObjectStore('draft');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function readDB(){let db=await openDraftDB();try{return await new Promise((resolve,reject)=>{let tx=db.transaction('draft','readonly'),req=tx.objectStore('draft').get('current');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}finally{db.close()}}
async function writeDB(data){let db=await openDraftDB();try{await new Promise((resolve,reject)=>{let tx=db.transaction('draft','readwrite');tx.objectStore('draft').put(data,'current');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}finally{db.close()}}
function snapshot(){return{savedAt:Date.now(),items:items.map(x=>({id:x.id,name:x.name,selected:x.selected,url:x.file?null:x.url,file:x.file||null})),page,watermark:$('watermark').checked,numbered:$('numbered').checked,size:$('size').value,input:$('input').value}}
function scheduleSave(){if(!ready)return;clearTimeout(saveTimer);saveTimer=setTimeout(()=>{let data=snapshot();saveChain=saveChain.catch(()=>{}).then(async()=>{try{await writeDB(data);try{localStorage.removeItem(draftKey)}catch{}$('storageState').textContent='草稿已自动保存到当前浏览器'}catch{try{localStorage.setItem(draftKey,JSON.stringify({...data,items:data.items.filter(x=>!x.file)}));$('storageState').textContent='链接已自动保存；本地图片需在支持浏览器存储的环境中保留'}catch{$('storageState').textContent='当前浏览器无法保存草稿，请勿关闭页面'}}})},250)}
async function restoreDraft(){let data,fallback;try{data=await readDB()}catch{}try{fallback=JSON.parse(localStorage.getItem(draftKey)||'null')}catch{}if(fallback&&(!data||fallback.savedAt>data.savedAt))data=fallback;if(data){items=(data.items||[]).map(x=>({...x,url:x.file?URL.createObjectURL(x.file):x.url})).filter(x=>x.url);page=data.page||0;$('watermark').checked=!!data.watermark;$('numbered').checked=!!data.numbered;if(['400','600','800','1200'].includes(data.size))$('size').value=data.size;$('input').value=data.input||''}$('storageState').textContent=data?'已恢复上次草稿':'草稿会自动保存到当前浏览器';ready=true;render()}
function positionBlurBands(){document.querySelectorAll('.imagebox img,.cell img').forEach(img=>{if(!img.complete||!img.naturalWidth||!img.naturalHeight)return;let box=img.parentElement,bw=img.clientWidth,bh=img.clientHeight,scale=Math.min(bw/img.naturalWidth,bh/img.naturalHeight),w=img.naturalWidth*scale,h=img.naturalHeight*scale,left=img.offsetLeft+(bw-w)/2,top=img.offsetTop+(bh-h)/2;box.style.setProperty('--image-left',`${left}px`);box.style.setProperty('--image-width',`${w}px`);box.style.setProperty('--stripe-top',`${top+h*(2/3-.04)}px`);box.style.setProperty('--stripe-height',`${h*.08}px`);box.style.setProperty('--number-left',`${left+5}px`);box.style.setProperty('--number-top',`${top+h-27}px`)})}
document.addEventListener('load',e=>{if(e.target.matches?.('.imagebox img,.cell img'))positionBlurBands()},true);
window.addEventListener('resize',positionBlurBands);
function render(){const picked=chosen(),count=pages();page=Math.max(0,Math.min(page,Math.max(0,count-1)));$('counter').textContent=items.length+' 张图片';$('chosen').textContent='已选 '+picked.length+' 张';$('dimensions').textContent=(+$('size').value*3)+' × '+(+$('size').value*3)+' px';
  document.body.classList.toggle('watermark-on',$('watermark').checked);
  $('gallery').innerHTML=items.map((x,i)=>`<div class="tile ${x.selected?'selected':''}" data-id="${x.id}"><div class="tilehead"><label><input type="checkbox" ${x.selected?'checked':''} data-action="select"> ${i+1}</label><span title="${escapeHtml(x.name)}">${escapeHtml(x.name.slice(0,8))}</span></div><div class="imagebox"><img src="${escapeHtml(x.url)}" loading="lazy" alt="第 ${i+1} 张"><i class="blurband"></i></div><div class="tilefoot"><button data-action="up" aria-label="上移">↑</button><button data-action="down" aria-label="下移">↓</button><button data-action="remove" aria-label="移除">移除</button></div></div>`).join('');
  let section=picked.slice(page*9,page*9+9);$('mosaic').innerHTML=Array.from({length:9},(_,i)=>`<div class="cell">${section[i]?`<img src="${escapeHtml(section[i].url)}" alt="拼图第 ${i+1} 格"><i class="blurband"></i>${$('numbered').checked?`<b>${page*9+i+1}</b>`:''}`:''}</div>`).join('');positionBlurBands();$('pageInfo').textContent=count?`第 ${page+1} / ${count} 幅 · 本幅 ${section.length} 张`:'请选择图片';$('prev').disabled=page<=0;$('next').disabled=page>=count-1;$('save').disabled=$('saveAll').disabled=!count||busy;$('saveSingles').disabled=!items.length||busy;$('clear').disabled=(!items.length&&!$('input').value.trim())||busy;scheduleSave()}
function status(s,error=false){$('status').textContent=s;$('status').classList.toggle('error',error)}
$('gallery').addEventListener('click',e=>{let btn=e.target.closest('[data-action]');if(!btn||btn.dataset.action==='select')return;let i=items.findIndex(x=>x.id===btn.closest('.tile').dataset.id),a=btn.dataset.action;if(a==='remove'){if(items[i].url.startsWith('blob:'))URL.revokeObjectURL(items[i].url);items.splice(i,1)}else{let j=i+(a==='up'?-1:1);if(j>=0&&j<items.length)[items[i],items[j]]=[items[j],items[i]]}render()});
$('gallery').addEventListener('change',e=>{if(e.target.dataset.action==='select'){let x=items.find(x=>x.id===e.target.closest('.tile').dataset.id);x.selected=e.target.checked;render()}});
$('extract').onclick=()=>{let urls=($('input').value.match(/https?:\/\/[^\s<>"'，,；;]+/gi)||[]).map(s=>s.replace(/[)\]。！!？?]+$/g,''));let old=new Set(items.map(x=>x.url));let add=0;for(let url of urls){try{let u=new URL(url);if(!/^https?:$/.test(u.protocol)||old.has(u.href))continue;items.push({id:crypto.randomUUID(),url:u.href,name:decodeURIComponent(u.pathname.split('/').pop()||'图片'),selected:true});old.add(u.href);add++}catch{}}$('input').value='';render();status(add?`已添加 ${add} 张图片${urls.length>add?'，重复或无效链接已跳过':''}。`:'没有找到新的有效图片链接。',!add)};
$('input').addEventListener('input',()=>{$('clear').disabled=!items.length&&!$('input').value.trim();scheduleSave()});
$('files').onchange=e=>{let n=0;for(let file of e.target.files){if(!file.type.startsWith('image/'))continue;let idx=items.findIndex(x=>x.name.toLowerCase()===file.name.toLowerCase());let url=URL.createObjectURL(file);if(idx>=0){if(items[idx].url.startsWith('blob:'))URL.revokeObjectURL(items[idx].url);items[idx].url=url;items[idx].file=file;items[idx].selected=true}else items.push({id:crypto.randomUUID(),url,name:file.name,file,selected:true});n++}e.target.value='';render();status(`已导入 ${n} 张本地图片。`)};
$('all').onclick=()=>{items.forEach(x=>x.selected=true);render()};$('none').onclick=()=>{items.forEach(x=>x.selected=false);render()};$('reverse').onclick=()=>{items.reverse();render()};$('clear').onclick=()=>{if((!items.length&&!$('input').value.trim())||!confirm('清空全部图片和输入内容？此操作无法撤销。'))return;for(let x of items)if(x.url.startsWith('blob:'))URL.revokeObjectURL(x.url);items=[];page=0;$('input').value='';render();status('草稿已清空。')};$('watermark').onchange=render;$('numbered').onchange=render;$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('size').onchange=render;
function loadImage(url){return new Promise((resolve,reject)=>{let img=new Image();if(!url.startsWith('blob:')&&!url.startsWith('data:'))img.crossOrigin='anonymous';img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('图片加载失败或图片站不允许跨域读取：'+url));img.src=url})}
function blurStripe(ctx,img,x,y,w,h){if(!$('watermark').checked)return;let stripeY=y+h*(2/3-.04),stripeH=h*.08;ctx.save();ctx.beginPath();ctx.rect(x,stripeY,w,stripeH);ctx.clip();ctx.filter=`blur(${Math.max(6,Math.round(Math.min(w,h)*.045))}px)`;ctx.drawImage(img,x,y,w,h);ctx.filter='none';ctx.fillStyle='#ffffff22';ctx.fillRect(x,stripeY,w,stripeH);ctx.restore()}
function drawNumber(ctx,number,x,y,w,h){if(!$('numbered').checked)return;let font=Math.max(12,Math.min(48,Math.round(Math.min(w,h)*.075))),pad=Math.max(4,Math.round(font*.4)),label=String(number);ctx.save();ctx.font=`bold ${font}px sans-serif`;ctx.textBaseline='middle';let labelW=ctx.measureText(label).width,boxW=labelW+pad*2,boxH=font+pad*1.3,bx=x+pad,by=y+h-boxH-pad;ctx.fillStyle='#211c33c9';ctx.fillRect(bx,by,boxW,boxH);ctx.fillStyle='#fff';ctx.fillText(label,bx+pad,by+boxH/2);ctx.restore()}
function pngBlob(canvas){return new Promise((resolve,reject)=>{try{canvas.toBlob(b=>b?resolve(b):reject(new Error('图片站禁止跨域导出，请将图片下载后通过“导入本地图片”加入。')),'image/png')}catch{reject(new Error('图片站禁止跨域导出，请将图片下载后通过“导入本地图片”加入。'))}})}
async function makePng(list,startIndex=0){let tile=+$('size').value,gap=Math.max(4,Math.round(tile*.014)),canvas=document.createElement('canvas');canvas.width=canvas.height=tile*3;let ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);for(let i=0;i<list.length;i++){let img=await loadImage(list[i].url),w=img.naturalWidth,h=img.naturalHeight;if(!w||!h)throw new Error('无法读取图片尺寸：'+list[i].name);let scale=Math.min((tile-gap*2)/w,(tile-gap*2)/h),dw=w*scale,dh=h*scale,x=(i%3)*tile+(tile-dw)/2,y=Math.floor(i/3)*tile+(tile-dh)/2;try{ctx.drawImage(img,x,y,dw,dh);blurStripe(ctx,img,x,y,dw,dh);drawNumber(ctx,startIndex+i+1,x,y,dw,dh)}catch{throw new Error('无法绘制图片：'+list[i].name)}}return pngBlob(canvas)}
async function makeSinglePng(item,index){let img=await loadImage(item.url),w=img.naturalWidth,h=img.naturalHeight;if(!w||!h)throw new Error('无法读取图片尺寸：'+item.name);let canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;let ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);blurStripe(ctx,img,0,0,w,h);drawNumber(ctx,index+1,0,0,w,h);return pngBlob(canvas)}
function download(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
function problem(err){let message=err?.message||String(err);status(message,true);$('errorText').textContent=message+'。若链接图片能显示、却不能保存，说明图片服务器限制浏览器读取。请把原图下载到本地，再用上方“导入本地图片”选择它们；同名文件会自动替换对应图片。';$('overlay').classList.add('on')}
$('closeDialog').onclick=()=>$('overlay').classList.remove('on');$('overlay').onclick=e=>{if(e.target===$('overlay'))$('overlay').classList.remove('on')};
$('save').onclick=async()=>{if(busy)return;busy=true;render();try{status('正在生成第 '+(page+1)+' 幅…');let blob=await makePng(chosen().slice(page*9,page*9+9),page*9);download(blob,`九宫格_${String(page+1).padStart(2,'0')}.png`);status('当前拼图已保存。')}catch(e){problem(e)}finally{busy=false;render()}};
// Minimal uncompressed ZIP writer: PNG bytes are already compressed.
const te=new TextEncoder();let crcTable=Array.from({length:256},(_,n)=>{for(let k=0;k<8;k++)n=n&1?0xedb88320^(n>>>1):n>>>1;return n>>>0});function crc32(a){let c=0xffffffff;for(let b of a)c=crcTable[(c^b)&255]^(c>>>8);return(c^0xffffffff)>>>0}
function zip(files){let chunks=[],central=[],offset=0;for(let f of files){let name=te.encode(f.name),data=f.data,crc=crc32(data),local=new Uint8Array(30+name.length),v=new DataView(local.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x0800,true);v.setUint32(14,crc,true);v.setUint32(18,data.length,true);v.setUint32(22,data.length,true);v.setUint16(26,name.length,true);local.set(name,30);chunks.push(local,data);let entry=new Uint8Array(46+name.length),d=new DataView(entry.buffer);d.setUint32(0,0x02014b50,true);d.setUint16(4,20,true);d.setUint16(6,20,true);d.setUint16(8,0x0800,true);d.setUint32(16,crc,true);d.setUint32(20,data.length,true);d.setUint32(24,data.length,true);d.setUint16(28,name.length,true);d.setUint32(42,offset,true);entry.set(name,46);central.push(entry);offset+=local.length+data.length}let centralSize=central.reduce((s,a)=>s+a.length,0),end=new Uint8Array(22),v=new DataView(end.buffer);v.setUint32(0,0x06054b50,true);v.setUint16(8,files.length,true);v.setUint16(10,files.length,true);v.setUint32(12,centralSize,true);v.setUint32(16,offset,true);return new Blob([...chunks,...central,end],{type:'application/zip'})}
$('saveAll').onclick=async()=>{if(busy)return;busy=true;render();let list=chosen(),files=[];try{for(let i=0;i<list.length;i+=9){status(`正在生成 ${Math.floor(i/9)+1} / ${Math.ceil(list.length/9)} 幅…`);let blob=await makePng(list.slice(i,i+9),i);files.push({name:`九宫格_${String(Math.floor(i/9)+1).padStart(2,'0')}.png`,data:new Uint8Array(await blob.arrayBuffer())});await new Promise(r=>setTimeout(r,0))}status('正在打包…');download(zip(files),'九宫格拼图_全部.zip');status(`已保存 ${files.length} 幅拼图的 ZIP 文件。`)}catch(e){problem(e)}finally{busy=false;render()}};
$('saveSingles').onclick=async()=>{if(busy)return;busy=true;render();let files=[];try{for(let i=0;i<items.length;i++){status(`正在导出单图 ${i+1} / ${items.length}…`);let blob=await makeSinglePng(items[i],i);files.push({name:`单图_${String(i+1).padStart(3,'0')}.png`,data:new Uint8Array(await blob.arrayBuffer())});await new Promise(r=>setTimeout(r,0))}status('正在打包单图…');download(zip(files),'全部单图.zip');status(`已保存 ${files.length} 张单图的 ZIP 文件。`)}catch(e){problem(e)}finally{busy=false;render()}};
